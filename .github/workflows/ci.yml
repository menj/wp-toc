name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer phpcs

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    env:
      WP_TOC_WP_VERSION: ${{ matrix.wp }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        wp: ['7.1.4']
        include:
          # Oldest supported WordPress (Requires at least).
          - php: '7.4'
            wp: '6.5.5'
          - php: '8.3'
            wp: '6.5.5'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: .cache/wordpress
          key: wordpress-${{ matrix.wp }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
