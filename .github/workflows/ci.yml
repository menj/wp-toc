name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer phpcs

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    env:
      WP_TOC_WP_VERSION: ${{ matrix.wp }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        wp: ['7.1.4']
        include:
          # Oldest supported WordPress (Requires at least).
          - php: '8.4'
            wp: '6.7.11'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: .cache/wordpress
          key: wordpress-${{ matrix.wp }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  php-guard:
    # WP TOC must refuse to load below PHP 8.4. No Composer needed.
    name: Refuses to load on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l wp-toc.php
      - run: php tests/php-version-guard.php
